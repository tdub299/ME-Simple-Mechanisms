<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Self-Study</title>
  <meta name="description" content="Self-paced lessons with diagrams and mastery quizzes.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%232f6fdb' stroke-width='4' stroke-dasharray='5 3.2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%232f6fdb'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Shared SVG markers used by every diagram (url(#ah), url(#ah-acc), url(#ah-fl)). -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
      <marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-acc" d="M0,0 L10,5 L0,10 z"/></marker>
      <marker id="ah-fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-fl" d="M0,0 L10,5 L0,10 z"/></marker>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="6"/></pattern>
    </defs>
  </svg>
  <header class="site-header">
    <a class="brand" href="#/">Self-Study</a>
    <nav class="header-nav">
      <a href="#/">Lessons</a>
      <a href="#/progress">Progress</a>
    </nav>
  </header>
  <main id="app" class="container" tabindex="-1">
    <p class="muted">Loading…</p>
  </main>
  <footer class="site-footer container">
    <p class="muted">Progress is saved in this browser. Use <a href="#/progress">Progress</a> to back it up or move it to another device.</p>
  </footer>
  <script src="js/registry.js"></script>
  <script src="lessons/index.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
